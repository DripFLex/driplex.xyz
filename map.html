<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map</title><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script>try{document.documentElement.classList.toggle('light',localStorage.getItem('theme')==='light')}catch(e){}</script></head><body><main>
<div id="map"></div>
<div class="map-stats"><div><b id="n">0</b><span>PLACES</span></div><div><b>195</b><span>COUNTRIES</span></div></div>
<script>
  // Places visited: [name, lat, lng]
  const places = [['Paris', 48.86, 2.35], ['Tokyo', 35.68, 139.69], ['Marrakech', 31.63, -8.0], ['Rome', 41.9, 12.5]];
  const map = L.map('map', { zoomControl: false }).setView([30, 10], 2);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
  places.forEach(([n, a, b]) => L.circleMarker([a, b], { radius: 6, color: '#e8b880' }).bindTooltip(n).addTo(map));
  document.getElementById('n').textContent = places.length;
</script>
</main><script src="nav.js"></script></body></html>

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Static site, no build: check every local href/src points to a file that exists.
      - name: Check internal links
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          bad = []
          files = sorted(pathlib.Path('.').glob('*.html')) + [pathlib.Path('nav.js')]
          for f in files:
              text = f.read_text(encoding='utf-8')
              for ref in re.findall(r'''(?:href|src)=["']([^"'#]+)''', text) + re.findall(r"\['([\w-]+\.html)'", text):
                  if '${' not in ref and not re.match(r'(https?:|mailto:|//)', ref) and not pathlib.Path(ref).exists():
                      bad.append(f'{f}: {ref}')
          print('\n'.join(bad) or f'OK: {len(files)} files checked')
          sys.exit(1 if bad else 0)
          EOF
